<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经办人实名认证 · 株洲市人才住房保障管理平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
<link rel="stylesheet" href="../../assets/css/ext.css">
</head>
<style>
.up-box { display: flex; gap: 10px; }
.up-i { flex: 1; height: 88px; border: 1px dashed var(--border-strong); border-radius: 9px;
  background: var(--bg-soft); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 5px; color: var(--text-3); font-size: 11.5px; }
.up-i i { font-size: 20px; color: var(--primary); }
.up-i.done { border-style: solid; border-color: var(--success);
  background: var(--success-light); color: var(--success); }
.up-i.done i { color: var(--success); }
.rg-step { display: flex; align-items: center; gap: 6px; padding: 12px 14px;
  background: var(--bg-card); border-bottom: 1px solid var(--row-line); }
.rg-step .s { flex: 1; text-align: center; font-size: 11.5px; color: var(--text-3); }
.rg-step .s b { display: block; width: 21px; height: 21px; margin: 0 auto 4px;
  border-radius: 50%; background: var(--bg-soft); color: var(--text-3);
  line-height: 21px; font-size: 11px; }
.rg-step .s.on { color: var(--primary); font-weight: 700; }
.rg-step .s.on b { background: var(--primary); color: #fff; }
.rg-step .s.ok b { background: var(--success); color: #fff; }
</style>
<body class="m-body" data-mtitle="经办人实名认证" data-mmod="M3 用人单位 · 实名认证"
      data-mcode="M3-04" data-mtabset="emp" data-mtab="info" data-mback="emp-info.html"
      data-mdesc="用人单位经办人登录后办理业务前须完成本人实名认证，核验姓名、身份证号与手机号是否与注册时填报的一致。未通过实名认证的只能查看单位信息，不能代申报、上报变更或提交任何业务，相关入口置灰。"
      data-mchan="小程序">
<div class="m-stage">
  <div class="m-phone">
    <div class="m-screen">
      <div class="m-view">
        <div class="m-note warn"><i class="fa-solid fa-triangle-exclamation"></i>
          <div>您已登录<b>中车株洲电力机车有限公司</b>单位端。
            办理业务前须完成<b>经办人本人实名认证</b>，
            未认证的只能查看单位信息，不能代申报或上报变更。</div>
        </div>

        <div class="m-sect">待核验信息<span class="m-sect-x">取自注册填报</span></div>
        <div class="m-card"><div class="m-card-b"><div class="m-form">
          <div class="m-fi"><label>姓名 <span class="req">*</span></label>
            <div class="m-fc"><input type="text" value="谭晓芸" readonly></div></div>
          <div class="m-fi col"><label>身份证号 <span class="req">*</span></label>
            <div class="m-fc"><input type="text" value="430211********2418" readonly>
              <div class="m-fh">与注册时填报的经办人身份证号一致方可通过</div></div></div>
          <div class="m-fi col"><label>手机号 <span class="req">*</span></label>
            <div class="m-fc"><input type="tel" value="138****6621" readonly>
              <div class="m-fh">当前登录账号，须与注册填报的经办人手机号一致</div></div></div>
        </div></div></div>

        <div class="m-sect">核验方式</div>
        <div class="m-opts">
          <div class="m-opt on"><span class="m-ok"><i class="fa-solid fa-check"></i></span>
            <span class="m-ol"><b>人脸识别核验</b>
              <span>调起摄像头采集人像，与公安权威库比对，即时返回结果</span></span></div>
          <div class="m-opt"><span class="m-ok"><i class="fa-solid fa-check"></i></span>
            <span class="m-ol"><b>身份证要素核验</b>
              <span>校验姓名、身份证号、手机号三要素一致性</span></span></div>
        </div>

        <div class="m-note"><i class="fa-solid fa-shield-halved"></i>
          <div>认证信息仅用于核验经办人身份，不作他用。
            认证通过后本账号即可代本单位职工申报、上报在职状态变更。
            <b>经办人变更后需重新认证。</b></div>
        </div>

        <div style="padding:14px">
          <a class="m-btn primary" href="javascript:void(0)"
             onclick="MB.confirm({title:'开始实名认证',message:'即将调起人脸识别？',detail:'请确保本人操作，光线充足、正对摄像头。认证通过后即可办理业务。',okText:'开始认证',onOk:function(){MB.toast('实名认证通过');setTimeout(function(){location.href='emp-declare.html';},900);}})">开始实名认证</a>
          <a class="m-btn" style="margin-top:10px" href="emp-info.html">稍后认证，先看单位信息</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../../assets/js/mobile.js"></script>
</body>
</html>
