<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用人单位登录 · 株洲市人才住房保障管理平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
<link rel="stylesheet" href="../../assets/css/ext.css">
</head>
<style>
.lgm-top { padding: 46px 22px 26px; text-align: center;
  background: linear-gradient(150deg, #17386f 0%, #1a5cb8 100%); color: #fff; }
.lgm-logo { width: 62px; height: 62px; margin: 0 auto 14px; border-radius: 16px;
  background: rgba(255,255,255,.18); display: flex; align-items: center;
  justify-content: center; font-size: 28px; }
.lgm-t { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
.lgm-s { margin-top: 7px; font-size: 12.5px; color: rgba(255,255,255,.82); line-height: 1.7; }
.lgm-body { padding: 20px 16px 16px; }
.lgm-auth { padding: 16px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--bg-card); }
.lgm-auth .ah { display: flex; align-items: center; gap: 9px; font-size: 14px;
  font-weight: 700; }
.lgm-auth .ah i { color: #07c160; font-size: 17px; }
.lgm-auth .ad { margin-top: 9px; font-size: 12px; color: var(--text-3); line-height: 1.8; }
.lgm-phone { margin-top: 13px; padding: 11px 13px; border-radius: 9px;
  background: var(--bg-soft); display: flex; align-items: center;
  justify-content: space-between; }
.lgm-phone .p { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
.lgm-phone .x { font-size: 11.5px; color: var(--text-3); }
.lgm-btn { margin-top: 14px; width: 100%; height: 44px; border: 0; border-radius: 9px;
  background: #07c160; color: #fff; font-family: var(--font); font-size: 15px;
  font-weight: 700; display: flex; align-items: center; justify-content: center;
  gap: 7px; cursor: pointer; }
.lgm-btn.blue { background: linear-gradient(135deg, #1a5cb8, #2f7de1); }
.lgm-alt { margin-top: 15px; text-align: center; font-size: 12.5px; }
.lgm-alt a { color: var(--primary); font-weight: 700; }
.lgm-hr { margin: 17px 0 13px; display: flex; align-items: center; gap: 10px;
  font-size: 11.5px; color: var(--text-3); }
.lgm-hr::before, .lgm-hr::after { content: ''; flex: 1; height: 1px;
  background: var(--border); }
.lgm-ag { margin-top: 15px; font-size: 11px; color: var(--text-3); line-height: 1.8;
  text-align: center; }
.lgm-ag a { color: var(--primary); }
</style>
<body class="m-body" data-mtitle="用人单位登录" data-mmod="M3 用人单位 · 登录"
      data-mcode="M3-01" data-mtabset="emp" data-mtab="declare" data-mback="../public/login-entry.html"
      data-mdesc="用人单位不走湘易办，使用独立的登录页面。小程序拉起手机号授权登录，取号后与已开通的经办人手机号比对，匹配的直接进入单位端；未注册的从本页「用人单位注册」入口自助提交注册申请。手机号即账号，不需填写账号密码。"
      data-mchan="小程序">
<div class="m-stage">
  <div class="m-phone">
    <div class="m-screen">
      <div class="m-view" style="padding:0">
        <div class="lgm-top">
          <div class="lgm-logo"><i class="fa-solid fa-building-user"></i></div>
          <div class="lgm-t">用人单位端</div>
          <div class="lgm-s">为本单位职工批量代申报　·　经办人手机号即账号</div>
        </div>
        <div class="lgm-body">
          <div class="lgm-auth">
            <div class="ah"><i class="fa-brands fa-weixin"></i>申请获取你的手机号</div>
            <div class="ad">取号后与已开通的经办人手机号比对，匹配的直接进入单位端。
              手机号即登录账号，不需填写账号密码。</div>
            <div class="lgm-phone">
              <span class="p">138****6621</span>
              <span class="x">微信绑定号码</span>
            </div>
            <button class="lgm-btn blue" onclick="MB.confirm({title:'授权手机号',message:'允许平台获取你的手机号？',detail:'系统将比对该手机号是否为已开通的经办人账号。未注册的单位请先提交注册申请。',okText:'允许',onOk:function(){MB.toast('登录成功，请先完成实名认证');setTimeout(function(){location.href='emp-verify.html';},800);}})">
              <i class="fa-solid fa-mobile-screen-button"></i> 手机号登录
            </button>
          </div>

          <div class="m-note warn" style="margin-top:15px"><i class="fa-solid fa-triangle-exclamation"></i>
            <div>登录后<b>办理业务前须完成经办人实名认证</b>，
              核验姓名、身份证号与手机号是否与注册时填报的一致。
              未通过认证的只能查看单位信息。</div>
          </div>

          <div class="lgm-hr">还没有账号</div>
          <div class="m-cells">
            <a class="m-cell" href="emp-register.html"><span class="m-ci orange"><i class="fa-solid fa-file-signature"></i></span><span class="m-cl"><b>用人单位注册</b><span class="m-cs">注册与账号申请一次办理，审核通过后开通</span></span><span class="m-cv"><span class="m-tag blue">自助</span></span><i class="m-ca fa-solid fa-angle-right"></i></a>
            <a class="m-cell" href="emp-reg-status.html"><span class="m-ci"><i class="fa-solid fa-magnifying-glass-chart"></i></span><span class="m-cl"><b>注册进度查询</b><span class="m-cs">凭手机号查询审核状态，退回的可修改后重提</span></span><i class="m-ca fa-solid fa-angle-right"></i></a>
          </div>

          <div class="lgm-alt" style="margin-top:16px">
            <a href="../public/login-entry.html">返回个人用户登录</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../../assets/js/mobile.js"></script>
</body>
</html>
