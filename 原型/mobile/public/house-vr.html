<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR 全景看房 · 株洲市人才住房保障管理平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
<link rel="stylesheet" href="../../assets/css/ext.css">
</head>
<body class="m-body" data-mtitle="VR 全景看房" data-mmod="M4 房源展示与看房选房" data-mcode="M4-04"
      data-mdesc="提供户型内部全景与小区环境漫游，人才不到现场即可判断房源，降低选房后放弃率。" data-mback="house-detail.html" data-mtabset="public" data-mtab="house">
<div class="m-stage">
  <div class="m-phone">
    <div class="m-screen">
      <div class="m-view">
        <div class="m-card" style="padding:0;overflow:hidden">
          <div class="m-vr" style="height:300px"><img src="https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=800&q=80" alt="客厅全景">
            <div class="m-vr-c"><i class="fa-solid fa-vr-cardboard"></i></div>
            <span class="m-vr-hot" style="left:12%;top:22%">主卧 ›</span>
            <span class="m-vr-hot" style="right:14%;top:34%">次卧 ›</span>
            <span class="m-vr-hot" style="left:44%;bottom:26%">厨房 ›</span>
            <span class="m-vr-hot" style="right:20%;bottom:18%">卫生间 ›</span>
            <div style="position:absolute;left:10px;top:10px"><span class="m-tag blue">客厅 · 全景</span></div>
          </div>
        </div>
        <div class="m-pills" style="margin-top:10px">
          <button class="on">客厅</button><button>主卧</button><button>次卧</button>
          <button>厨房</button><button>卫生间</button><button>阳台</button><button>小区环境</button>
        </div>
        <div class="m-note"><i class="fa-solid fa-circle-info"></i>
          <div>拖动画面可 360° 环视，点击热点可切换至相邻空间。<b>不到现场即可判断房源</b>，降低选房后放弃率。</div>
        </div>
        <div class="m-sect">实景图片<span class="m-sect-x">6 张</span></div>
        <div class="m-card">
          <div class="m-card-h"><i class="fa-solid fa-images"></i>房源实景</div>
          <div class="m-card-b">
            <div class="m-up">
              <div class="m-uc"><img src="https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=800&q=80" alt="客厅"><span class="m-uc-n">客厅</span></div>
              <div class="m-uc"><img src="https://images.unsplash.com/photo-1540518614846-7eded433c457?w=800&q=80" alt="主卧"><span class="m-uc-n">主卧</span></div>
              <div class="m-uc"><img src="https://images.unsplash.com/photo-1505873242700-f289a29e1e0f?w=800&q=80" alt="次卧"><span class="m-uc-n">次卧</span></div>
              <div class="m-uc"><img src="https://images.unsplash.com/photo-1556909212-d5b604d0c90d?w=800&q=80" alt="厨房"><span class="m-uc-n">厨房</span></div>
              <div class="m-uc"><img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=800&q=80" alt="卫生间"><span class="m-uc-n">卫生间</span></div>
              <div class="m-uc"><img src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=800&q=80" alt="小区环境"><span class="m-uc-n">小区环境</span></div>
            </div>
          </div>
        </div>
        <div class="m-sect">本套房源</div>
        <div class="m-card">
          <div class="m-card-h"><i class="fa-solid fa-house-chimney"></i>房源信息<a class="m-more" href="house-detail.html">完整详情 <i class="fa-solid fa-angle-right"></i></a></div>
          <div class="m-card-b">
          <div class="m-kv">
            <div><span>房号</span><span>湘江1958 A6 栋 1502</span></div>
            <div><span>户型 / 面积</span><span>二室一厅　78.60 ㎡</span></div>
            <div><span>装修标准</span><span>精装 · 拎包入住</span></div>
            <div><span>个人自付</span><span><b style="color:var(--danger)">471.60 元/月</b></span></div>
            <div><span>房态</span><span><span class="m-tag green">可配租</span></span></div>
          </div>
          </div>
        </div>
        <div class="m-card">
          <div class="m-card-h"><i class="fa-solid fa-circle-info"></i>素材说明</div>
          <div class="m-card-b">
          <div class="m-kv">
            <div><span>VR 素材来源</span><span>运营机构报送并经房源展示配置审核</span></div>
            <div><span>服务提供方</span><span>地图与 VR 服务商（全景素材托管）</span></div>
            <div><span>素材更新</span><span>房源装修或家电配置变更后须重新采集</span></div>
          </div>
          </div>
        </div>
      </div>
      <div class="m-actbar">
        <a class="m-btn w-auto" href="house-detail.html">返回详情</a>
        <a class="m-btn primary" href="apply-house-list.html"><i class="fa-solid fa-arrow-right"></i> 我要申请</a>
      </div>
    </div>
  </div>
</div>

<script src="../../assets/js/mobile.js"></script>
</body>
</html>
