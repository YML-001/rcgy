<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>意见反馈 · 株洲市人才住房保障管理平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
<link rel="stylesheet" href="../../assets/css/ext.css">
</head>
<body class="m-body" data-mtitle="意见反馈" data-mmod="M2 个人中心" data-mcode="M2-09"
      data-mdesc="提交使用问题与建议，可查看处理结果。" data-mback="me.html" data-mtabset="public" data-mtab="me">
<div class="m-stage">
  <div class="m-phone">
    <div class="m-screen">
      <div class="m-view">
        <div class="m-seg">
          <button class="on">我的反馈 2</button>
          <button>已处理 1</button>
        </div>
        <div class="m-cells">
          <div class="m-cell"><span class="m-ci orange"><i class="fa-solid fa-comment-dots"></i></span><span class="m-cl"><b>选房时段提醒希望提前 1 天</b><span class="m-cs">2026-09-10 提交 · 功能建议</span></span><span class="m-cv"><span class="m-tag orange">处理中</span></span></div>
          <a class="m-cell" href="me-feedback.html"><span class="m-ci green"><i class="fa-solid fa-comment-dots"></i></span><span class="m-cl"><b>账单明细希望显示计算公式</b><span class="m-cs">2026-08-06 提交 · 功能建议</span></span><span class="m-cv"><span class="m-tag green">已采纳</span></span></a>
        </div>
        <div class="m-card">
          <div class="m-card-h"><i class="fa-solid fa-circle-check"></i>最近一条处理结果</div>
          <div class="m-card-b">
          <div class="m-kv">
            <div><span>处理部门</span><span>市保障性住房服务中心信息科</span></div>
            <div><span>处理时间</span><span>2026-08-12 14:26</span></div>
            <div><span>处理结果</span><span>已采纳并上线</span></div>
            <div><span>回复</span><span>感谢建议。账单明细页已增加「计算依据」一行，展示计租面积 × 租金标准的完整公式。</span></div>
          </div>
          </div>
        </div>
        <div class="m-note"><i class="fa-solid fa-circle-info"></i>
          <div>反馈受理后由<b>市保障性住房服务中心</b>限时办结并开展回访，处理结果将推送至消息中心。</div>
        </div>
        <div class="m-sect">提交新反馈</div>
        <div class="m-form">
          <div class="m-fi">
            <label>反馈类型 <span class="req">*</span></label>
            <div class="m-fc"><select><option value="">请选择</option><option>功能建议</option><option>操作问题</option><option>数据有误</option><option>政策咨询</option><option>其他</option></select></div>
          </div>
          <div class="m-fi">
            <label>关联业务</label>
            <div class="m-fc"><select><option value="">请选择（可选）</option><option>资格申请</option><option>房源与选房</option><option>电子签约</option><option>租金账单</option><option>报修与服务</option><option>年审与退出</option></select></div>
          </div>
          <div class="m-fi">
            <label>反馈内容 <span class="req">*</span></label>
            <div class="m-fc"><textarea rows="4" placeholder="请描述您遇到的问题或建议，不少于 10 字">建议在租金账单页增加历史账单对比与到期自动提醒功能，方便及时缴费、避免逾期，谢谢。</textarea></div>
          </div>
          <div class="m-fi">
            <label>截图</label>
            <div class="m-fc"><div class="m-up">
                <div class="m-uadd" data-toast="原型演示：调起相机或从相册选择"><i class="fa-solid fa-image"></i><span>添加截图</span></div>
              </div><div class="m-fh">最多 3 张，便于定位问题</div></div>
          </div>
          <div class="m-fi">
            <label>联系方式</label>
            <div class="m-fc"><input type="tel" value="13802456207"><div class="m-fh">便于回访，默认取实名手机号</div></div>
          </div>
        </div>
      </div>
      <div class="m-actbar">
        <button class="m-btn primary block" type="button" onclick="MB.submit('.m-form','确认提交本条反馈？提交后由市住保中心限时办结并回访。','确认提交','me-feedback.html')"><i class="fa-solid fa-paper-plane"></i> 提交反馈</button>
      </div>
    </div>
  </div>
</div>

<script src="../../assets/js/mobile.js"></script>
</body>
</html>
