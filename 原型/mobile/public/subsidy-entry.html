<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人才购房补贴 · 株洲市人才住房保障管理平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
<link rel="stylesheet" href="../../assets/css/ext.css">
<style>
.sj-hd{background:linear-gradient(135deg,#43C08A,#22A06B);color:#fff;
  padding:18px 14px 20px;border-radius:0 0 14px 14px;text-align:center}
.sj-hd .ic{width:56px;height:56px;margin:0 auto 10px;border-radius:16px;
  background:rgba(255,255,255,.2);display:flex;align-items:center;
  justify-content:center;font-size:26px}
.sj-hd .t{font-size:18px;font-weight:800}
.sj-hd .s{font-size:11.5px;opacity:.92;margin-top:6px;line-height:1.6}
.sj-go{margin:16px 14px;background:#fff;border-radius:12px;padding:16px;
  text-align:center}
.sj-go .q{font-size:13px;color:#5C6B7F;line-height:1.7}
.sj-go .btn{display:block;margin-top:14px;background:linear-gradient(135deg,#43C08A,#22A06B);
  color:#fff;font-size:15px;font-weight:700;border-radius:22px;padding:12px;
  text-decoration:none}
.sj-go .tip{font-size:11px;color:#9AA7B8;margin-top:10px}
</style>
</head>
<body class="m-body" data-mtitle="人才购房补贴" data-mmod="M1 个人用户 · 人才购房补贴入口" data-mcode="M1-04"
      data-mdesc="购房补贴不在本平台建设，点击后免登录跳转至市委组织部现有系统办理；本页只保留跳转入口与补贴政策公开。" data-mback="home.html" data-mtabset="public"
      data-mtab="home" data-mchan="湘易办">
<div class="m-stage">
  <div class="m-phone">
    <div class="m-screen">
      <div class="m-view">
        <div class="sj-hd">
          <div class="ic"><i class="fa-solid fa-house-circle-check"></i></div>
          <div class="t">人才购房补贴</div>
          <div class="s">购房补贴的申请、审核、公示与发放<br>
            在市委组织部人才购房补贴系统办理</div>
        </div>
        <div class="sj-go">
          <div class="q">本平台不重复建设购房补贴功能，<br>
            点击下方按钮跳转至购房补贴系统，<br>
            使用湘易办账号免登录直接办理。</div>
          <a class="btn" href="javascript:void(0)"
             onclick="alert('原型演示：免登录跳转至市委组织部人才购房补贴系统')">
            前往购房补贴系统 ›</a>
          <div class="tip">跳转后办理进度、公示结果均在该系统查询</div>
        </div>
        <div class="m-sect">补贴政策公开</div>
        <div class="m-cells">
          <a class="m-cell" href="policy-detail.html">
            <span class="m-ci green"><i class="fa-solid fa-file-lines"></i></span>
            <span class="m-cl"><b>人才购房补贴政策原文</b>
              <span class="m-cs">补贴对象、标准与申领流程</span></span>
            <i class="m-ca fa-solid fa-angle-right"></i></a>
          <a class="m-cell" href="policy-detail.html">
            <span class="m-ci orange"><i class="fa-solid fa-triangle-exclamation"></i></span>
            <span class="m-cl"><b>五年限售提示</b>
              <span class="m-cs">领取补贴后五年内房屋限制交易，转让须退回补贴</span></span>
            <i class="m-ca fa-solid fa-angle-right"></i></a>
        </div>
        <div class="m-note"><i class="fa-solid fa-circle-info"></i>
          <div>购房补贴与人才公寓租房保障是两项独立政策，
            可分别申请，互不影响。</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../../assets/js/mobile.js"></script>
</body>
</html>
